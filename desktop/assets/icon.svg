<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background: deep abyss -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#141E2B" />
      <stop offset="100%" stop-color="#090D12" />
    </radialGradient>

    <!-- Body: specular teal highlight top-left, deep shadow bottom-right -->
    <radialGradient id="bodyMain" cx="38%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#1E96B8" />
      <stop offset="28%" stop-color="#157A98" />
      <stop offset="58%" stop-color="#0E5A74" />
      <stop offset="100%" stop-color="#07384A" />
    </radialGradient>

    <!-- Mid tentacle gradient -->
    <linearGradient id="tentMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C5268" />
      <stop offset="100%" stop-color="#053040" />
    </linearGradient>

    <!-- Back tentacle — darkest -->
    <linearGradient id="tentBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#084050" />
      <stop offset="100%" stop-color="#021820" />
    </linearGradient>

    <!-- Front tentacle — lighter for pop -->
    <linearGradient id="tentFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F6078" />
      <stop offset="100%" stop-color="#073848" />
    </linearGradient>

    <!-- Headband fabric gradient -->
    <linearGradient id="bandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00BB30" />
      <stop offset="15%" stop-color="#00EE3C" />
      <stop offset="50%" stop-color="#00FF41" />
      <stop offset="85%" stop-color="#00EE3C" />
      <stop offset="100%" stop-color="#00BB30" />
    </linearGradient>

    <!-- Eye glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#22FF55" />
      <stop offset="50%" stop-color="#00FF41" />
      <stop offset="100%" stop-color="#00BB30" />
    </radialGradient>

    <!-- Bio glow filter -->
    <filter id="bioGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <!-- Eye filter -->
    <filter id="eyeF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <!-- Band glow -->
    <filter id="bandF" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <!-- Sucker gradient -->
    <radialGradient id="suckG" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0D6880" />
      <stop offset="100%" stop-color="#063548" />
    </radialGradient>

    <!-- Clip path for background circle -->
    <clipPath id="bgClip"><circle cx="256" cy="256" r="250" /></clipPath>
  </defs>

  <!-- ═══════ BACKGROUND ═══════ -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGlow)" />

  <!-- ═══════ BACK TENTACLES (layer 0) — peek behind body ═══════ -->
  <!-- Back-left: thick, sweeps far left -->
  <path d="M160,298 C140,335 100,390 72,435
           Q58,462 55,475 Q54,488 65,485
           Q78,480 95,458 C118,420 148,365 168,318 Z"
        fill="url(#tentBack)" opacity="0.5" />
  <!-- Back-right: mirror -->
  <path d="M352,298 C372,335 412,390 440,435
           Q454,462 457,475 Q458,488 447,485
           Q434,480 417,458 C394,420 364,365 344,318 Z"
        fill="url(#tentBack)" opacity="0.5" />

  <!-- ═══════ MID TENTACLES (layer 1) — four thick, fleshy arms ═══════ -->

  <!-- Mid-left-outer: wide base, curls at tip -->
  <path d="M142,305 C122,348 88,405 68,448
           Q55,475 50,488 Q48,498 58,497
           Q72,494 90,472 C112,440 140,390 160,342
           Q168,322 160,308 Z"
        fill="url(#tentMid)" />

  <!-- Mid-left-inner -->
  <path d="M198,318 C184,358 162,412 148,452
           Q140,472 138,484 Q137,494 146,492
           Q158,488 170,466 C186,432 202,382 214,340
           Q218,326 210,318 Z"
        fill="url(#tentMid)" />

  <!-- Mid-right-inner -->
  <path d="M314,318 C328,358 350,412 364,452
           Q372,472 374,484 Q375,494 366,492
           Q354,488 342,466 C326,432 310,382 298,340
           Q294,326 302,318 Z"
        fill="url(#tentMid)" />

  <!-- Mid-right-outer -->
  <path d="M370,305 C390,348 424,405 444,448
           Q457,475 462,488 Q464,498 454,497
           Q440,494 422,472 C400,440 372,390 352,342
           Q344,322 352,308 Z"
        fill="url(#tentMid)" />

  <!-- ═══════ SUCKERS — front tentacles only (cleaner at small sizes) ═══════ -->

  <!-- ═══════ BODY — single organic path ═══════ -->
  <path d="M256,78
           C318,78 378,104 406,155
           C428,196 432,240 424,272
           C418,298 404,318 384,332
           C358,350 326,355 300,348
           L256,352 L212,348
           C186,355 154,350 128,332
           C108,318 94,298 88,272
           C80,240 84,196 106,155
           C134,104 194,78 256,78 Z"
        fill="url(#bodyMain)" />

  <!-- Rim light on dome -->
  <path d="M175,106 C208,90 240,82 256,82 C290,84 334,96 365,114"
        stroke="#2AB4D4" stroke-width="2.5" fill="none" opacity="0.22" stroke-linecap="round" />

  <!-- Body-tentacle shadow junction -->
  <path d="M140,332 C178,348 218,356 256,356 C294,356 334,348 372,332"
        stroke="#021418" stroke-width="12" fill="none" opacity="0.35" stroke-linecap="round" />

  <!-- ═══════ FRONT TENTACLES (layer 2 — over body) ═══════ -->
  <!-- Thick, drape forward over the body edge -->

  <!-- Front-left -->
  <path d="M178,330 C162,368 138,414 122,450
           Q112,474 110,486 Q108,496 118,494
           Q132,490 148,465 C168,430 186,385 196,352
           Q200,340 192,330 Z"
        fill="url(#tentFront)" />

  <!-- Front-right -->
  <path d="M334,330 C350,368 374,414 390,450
           Q400,474 402,486 Q404,496 394,494
           Q380,490 364,465 C344,430 326,385 316,352
           Q312,340 320,330 Z"
        fill="url(#tentFront)" />

  <!-- Front suckers -->
  <ellipse cx="155" cy="400" rx="8" ry="5" fill="url(#suckG)" opacity="0.72" />
  <ellipse cx="144" cy="428" rx="7" ry="4.5" fill="url(#suckG)" opacity="0.62" />
  <ellipse cx="135" cy="454" rx="6" ry="4" fill="url(#suckG)" opacity="0.52" />
  <ellipse cx="357" cy="400" rx="8" ry="5" fill="url(#suckG)" opacity="0.72" />
  <ellipse cx="368" cy="428" rx="7" ry="4.5" fill="url(#suckG)" opacity="0.62" />
  <ellipse cx="377" cy="454" rx="6" ry="4" fill="url(#suckG)" opacity="0.52" />

  <!-- ═══════ BIOLUMINESCENT TIPS ═══════ -->
  <!-- All 8 tips glow -->
  <circle cx="62" cy="486" r="9" fill="#00FF41" opacity="0.45" filter="url(#bioGlow)" />
  <circle cx="55" cy="496" r="7" fill="#00FF41" opacity="0.35" filter="url(#bioGlow)" />
  <circle cx="118" cy="494" r="8" fill="#00FF41" opacity="0.4" filter="url(#bioGlow)" />
  <circle cx="146" cy="492" r="7.5" fill="#00FF41" opacity="0.38" filter="url(#bioGlow)" />
  <circle cx="366" cy="492" r="7.5" fill="#00FF41" opacity="0.38" filter="url(#bioGlow)" />
  <circle cx="394" cy="494" r="8" fill="#00FF41" opacity="0.4" filter="url(#bioGlow)" />
  <circle cx="450" cy="486" r="9" fill="#00FF41" opacity="0.45" filter="url(#bioGlow)" />
  <circle cx="457" cy="496" r="7" fill="#00FF41" opacity="0.35" filter="url(#bioGlow)" />

  <!-- ═══════ HACHIMAKI HEADBAND ═══════ -->
  <!-- Cast shadow on face below band -->
  <path d="M102,202 C138,215 198,224 256,224 C314,224 374,215 410,202"
        stroke="#021418" stroke-width="10" fill="none" opacity="0.28" />

  <!-- Main band — wraps around dome curvature -->
  <path d="M95,180 C130,196 195,206 256,206
           C317,206 382,196 417,180
           L420,196 C385,214 318,224 256,224
           C194,224 127,214 92,196 Z"
        fill="url(#bandGrad)" opacity="0.9" filter="url(#bandF)" />

  <!-- Fabric folds -->
  <path d="M228,198 C242,202 270,202 284,198" stroke="#55FF88" stroke-width="1.5" fill="none" opacity="0.3" />
  <path d="M110,190 C126,195 148,200 168,202" stroke="#007722" stroke-width="1.5" fill="none" opacity="0.3" />
  <path d="M402,190 C386,195 364,200 344,202" stroke="#007722" stroke-width="1.5" fill="none" opacity="0.3" />

  <!-- Knot (right side of head) -->
  <ellipse cx="424" cy="188" rx="12" ry="10" fill="#00EE3A" opacity="0.82" />
  <!-- Upper tail — flowing upward in current -->
  <path d="M432,180 C446,166 458,148 454,136
           Q452,128 444,132 Q442,140 446,155 Q444,168 436,174"
        fill="#00DD35" opacity="0.6" />
  <!-- Lower tail — shorter curl -->
  <path d="M432,198 C448,202 460,198 464,188
           Q466,180 458,180 Q456,188 450,194 Q444,198 438,196"
        fill="#00CC30" opacity="0.45" />

  <!-- ═══════ EYES — narrow, ancient, bioluminescent ═══════ -->

  <!-- Left eye -->
  <ellipse cx="210" cy="252" rx="28" ry="16" fill="#00FF41" opacity="0.07" filter="url(#eyeF)" />
  <ellipse cx="210" cy="252" rx="22" ry="14" fill="url(#eyeGlow)" filter="url(#eyeF)" />
  <ellipse cx="213" cy="252" rx="4.5" ry="12" fill="#090D12" />
  <circle cx="203" cy="247" r="4" fill="#FFF" opacity="0.8" />
  <circle cx="219" cy="256" r="2" fill="#FFF" opacity="0.35" />

  <!-- Right eye -->
  <ellipse cx="302" cy="252" rx="28" ry="16" fill="#00FF41" opacity="0.07" filter="url(#eyeF)" />
  <ellipse cx="302" cy="252" rx="22" ry="14" fill="url(#eyeGlow)" filter="url(#eyeF)" />
  <ellipse cx="305" cy="252" rx="4.5" ry="12" fill="#090D12" />
  <circle cx="295" cy="247" r="4" fill="#FFF" opacity="0.8" />
  <circle cx="311" cy="256" r="2" fill="#FFF" opacity="0.35" />

  <!-- ═══════ BROW RIDGES ═══════ -->
  <path d="M180,236 C192,228 210,224 230,227"
        stroke="#073845" stroke-width="3.5" fill="none" opacity="0.4" stroke-linecap="round" />
  <path d="M332,236 C320,228 302,224 282,227"
        stroke="#073845" stroke-width="3.5" fill="none" opacity="0.4" stroke-linecap="round" />

  <!-- ═══════ MOUTH — stern, subtle ═══════ -->
  <path d="M234,290 C244,294 256,296 268,294 C278,290 274,286 266,288
           C258,290 254,290 246,288 C238,286 232,287 234,290 Z"
        fill="#053038" opacity="0.5" />
</svg>
