[package]
name = "vibe-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "~0.29"
ratatui-image = { version = "10", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
crossterm = "~0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
